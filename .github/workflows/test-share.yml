name: Conferir compartilhamento no APK
on:
  push:
    branches: ['distribuicao/ui-v1.8.2']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install downloads/Save-It-1.8.2.apk
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            node desktop/check-shared-video.cjs
            adb shell pm clear br.com.saveit
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            node desktop/check-shared-video.cjs
