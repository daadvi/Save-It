name: Publicar HTML e APK
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*', 'logo-v*', 'ui-v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar teste de navegador
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/browser-test" --no-package-lock playwright-core@1.55.0
      - name: Testar o HTML local no Chrome
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/browser-test/node_modules"
          node desktop/check.cjs
      - name: Publicar os dois downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == ui-v* ]]; then
            git show ea5629dcd0d34965c8d4b6bc5e55822c52a4aea6:downloads/Save-It-1.3.0.apk > Save-It-1.3.0.apk
            echo 'fa17c41d678c29a2ad19931dcbf7da44155d2a458b7b0be07f3910ceca38d351  Save-It-1.3.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.3.0.apk --verify-tag --latest --title 'Save It! 1.3.0 — interface Android renovada' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == logo-v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git show db4608c6ed6ca9ee7a9e55249364e4a89c0d34f1:downloads/Save-It-1.2.0.apk > Save-It-1.2.0.apk
            echo '618a70cb8ef3a487036eb1dd12b640ef5c17e8db116d09207379e5514838b613  Save-It-1.2.0.apk' | sha256sum -c -
            gh release upload logo-v1.2.0 desktop/Save-It.html Save-It-1.2.0.apk --clobber
          else
            git show 25ef54b2153275e5f248fa04410520a3effdd74e:downloads/Save-It-1.1.0.apk > Save-It-1.1.0.apk
            echo '5cf1f4b71a3cf5f72ffc5323ba1f61f40f621d6b2395cfb642e0e6ef30bcc8d1  Save-It-1.1.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.1.0.apk --verify-tag --latest --title 'Save It! para Windows e Android' --notes-file desktop/release.md
          fi
