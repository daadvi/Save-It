name: Publicar HTML e APK
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*', 'logo-v*', 'ui-v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar teste de navegador
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP/browser-test" --no-package-lock playwright-core@1.55.0
      - name: Testar o HTML local no Chrome
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/browser-test/node_modules"
          node --test desktop/check-import.cjs
          node desktop/check.cjs
          if ($env:GITHUB_REF_NAME -in @("ui-v1.6.0", "ui-v1.8.0", "ui-v1.8.1", "ui-v1.8.2")) { node desktop/check-android.cjs }
      - name: Publicar os dois downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == ui-v1.8.2 ]]; then
            git show ad48982250c01ddb45a5f16a66e8024c3eb6e9d4:downloads/Save-It-1.8.2.apk > Save-It-1.8.2.apk
            echo '429df18b19007f0e0e24c2a1ecc53af8ac727f5292ac86e5047e663adc0b639e  Save-It-1.8.2.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.8.2.apk --verify-tag --latest --title 'Save It! 1.8.2 — espaçamento dos filtros de pastas' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.8.1 ]]; then
            git show 92e63a4c3e5644ddc49a23e6d0af933fac2e36ef:downloads/Save-It-1.8.1.apk > Save-It-1.8.1.apk
            echo 'eca5d17d179d829194758e44164509a7412300fb06ddfbcd0384c31e3e001f27  Save-It-1.8.1.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.8.1.apk --verify-tag --latest --title 'Save It! 1.8.1 — dock mais baixa no Android' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.8.0 ]]; then
            git show 0d5a3401f9534d4c0ddf1860eebf2e908ab88c7d:downloads/Save-It-1.8.0.apk > Save-It-1.8.0.apk
            echo 'c8331cbd3cf26f249b5be958a7ad348f9b3547dfeeba4f2895939b8ecaf72f3b  Save-It-1.8.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.8.0.apk --verify-tag --latest --title 'Save It! 1.8.0 — descrições e compartilhamento de vídeos' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.7.0 ]]; then
            git show 6c514aa11764271c35c69a74c762a269752c5f73:downloads/Save-It-1.7.0.apk > Save-It-1.7.0.apk
            echo 'f0b6f1330e9f052f479f511e0e2efb28d34f0b7fdd1a4aa661e4fc68f23808e2  Save-It-1.7.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.7.0.apk --verify-tag --latest --title 'Save It! 1.7.0 — importação de backups Savr' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.6.1 ]]; then
            git show 462ded656da6613e24d452e13160c518d10fc5c8:downloads/Save-It-1.6.1.apk > Save-It-1.6.1.apk
            echo 'ea6b254696732991f19c035d7ad228baf787cb6b429b34d8153b9fa37cc76f8a  Save-It-1.6.1.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.6.1.apk --verify-tag --latest --title 'Save It! 1.6.1 — cabeçalho e dock inteiros' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.6.0 ]]; then
            git show e3a721c92e4b8f7a9d1271ee280e1f9a1c752907:downloads/Save-It-1.6.0.apk > Save-It-1.6.0.apk
            echo 'be9b5cc2dcad729dc12198d0199dc36bdae0a8e85f87fe3fe07909e8393a0526  Save-It-1.6.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.6.0.apk --verify-tag --latest --title 'Save It! 1.6.0 — Interface HTML no Android' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.5.0 ]]; then
            git show 15870dbebd965a085404539bc6c075a58b0bb529:downloads/Save-It-1.5.0.apk > Save-It-1.5.0.apk
            echo 'c913dc35e1f26ca10f5ae8596f2456b000f1a60f5c3e7e2e774f0a26065a9813  Save-It-1.5.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.5.0.apk --verify-tag --latest --title 'Save It! 1.5.0 — cores e dock corrigidas' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v1.4.0 ]]; then
            git show 5118e17fad171420210e12d7efdc59a980a4debb:downloads/Save-It-1.4.0.apk > Save-It-1.4.0.apk
            echo '5e8ef0c7a5b76db25469b16fd99201ec01a68d4c0e020d2df7f4b36690af4788  Save-It-1.4.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.4.0.apk --verify-tag --latest --title 'Save It! 1.4.0 — Android com visual do computador' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == ui-v* ]]; then
            git show ea5629dcd0d34965c8d4b6bc5e55822c52a4aea6:downloads/Save-It-1.3.0.apk > Save-It-1.3.0.apk
            echo 'fa17c41d678c29a2ad19931dcbf7da44155d2a458b7b0be07f3910ceca38d351  Save-It-1.3.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.3.0.apk --verify-tag --latest --title 'Save It! 1.3.0 — interface Android renovada' --notes-file desktop/release.md
          elif [[ "$GITHUB_REF_NAME" == logo-v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git show db4608c6ed6ca9ee7a9e55249364e4a89c0d34f1:downloads/Save-It-1.2.0.apk > Save-It-1.2.0.apk
            echo '618a70cb8ef3a487036eb1dd12b640ef5c17e8db116d09207379e5514838b613  Save-It-1.2.0.apk' | sha256sum -c -
            gh release upload logo-v1.2.0 desktop/Save-It.html Save-It-1.2.0.apk --clobber
          else
            git show 25ef54b2153275e5f248fa04410520a3effdd74e:downloads/Save-It-1.1.0.apk > Save-It-1.1.0.apk
            echo '5cf1f4b71a3cf5f72ffc5323ba1f61f40f621d6b2395cfb642e0e6ef30bcc8d1  Save-It-1.1.0.apk' | sha256sum -c -
            gh release create "$GITHUB_REF_NAME" desktop/Save-It.html Save-It-1.1.0.apk --verify-tag --latest --title 'Save It! para Windows e Android' --notes-file desktop/release.md
          fi
