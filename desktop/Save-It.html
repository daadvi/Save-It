<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#c9b9ff" />
    <meta
      name="description"
      content="Salve o que te inspira. Organize links em pastas e volte às suas melhores descobertas."
    />
    <title>Save It! — seu canto da internet</title>
    <link
      rel="icon"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjQ2IiBoZWlnaHQ9IjQ2IiByeD0iOCIgZmlsbD0iI2M3YWFmYSIgc3Ryb2tlPSIjMjAxZjIyIiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNMTMgN2gyMnYzNGwtMTEtOC0xMSA4eiIgZmlsbD0iI2ZmZjJhMyIgc3Ryb2tlPSIjMjAxZjIyIiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4K"
      type="image/svg+xml"
    />
    <style>
      :root {
        --paper: #f7f7f2;
        --surface: #fff;
        --ink: #202020;
        --muted: #65655f;
        --accent: #c9b9ff;
        --line: 2px solid var(--ink);
        --shadow: 4px 4px 0 var(--ink);
        font-family: "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-size: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      a {
        color: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #6250dc;
        outline-offset: 4px;
      }
      button {
        background: var(--surface);
      }
      .skip {
        position: fixed;
        top: -100px;
        z-index: 20;
        background: var(--accent);
        padding: 12px;
      }
      .skip:focus {
        top: 10px;
      }
      .topbar {
        height: 94px;
        padding: 0 4.5%;
        display: flex;
        align-items: center;
        gap: 24px;
        border-bottom: var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: center;
        text-decoration: none;
        font:
          700 39px "Segoe UI",
          sans-serif;
        letter-spacing: -2.7px;
        gap: 8px;
      }
      .brand-icon {
        width: 41px;
        height: 41px;
        display: grid;
        place-items: center;
        background: var(--accent);
        border: var(--line);
        font-size: 34px;
        letter-spacing: 0;
        transform: rotate(-8deg);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .brand-bang {
        color: #7052ac;
      }
      .tagline {
        font-size: 14px;
        border-left: 1px solid #c6c6bd;
        padding-left: 23px;
        color: var(--muted);
      }
      .button {
        border: var(--line);
        box-shadow: var(--shadow);
        border-radius: 5px;
        padding: 13px 20px;
        display: inline-flex;
        gap: 9px;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0 var(--ink);
      }
      .button:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      .button.primary {
        background: var(--accent);
      }
      .button.small {
        font-size: 14px;
        padding: 9px 14px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .import-top {
        margin-left: auto;
      }
      .local-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .local-badge span {
        width: 8px;
        height: 8px;
        border: 1px solid var(--ink);
        background: #b4dba3;
        border-radius: 50%;
      }
      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 45px 4.5% 150px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .eyebrow:before {
        content: "";
        width: 19px;
        height: 3px;
        background: var(--ink);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font:
          700 clamp(32px, 3.6vw, 51px) / 1.14 "Segoe UI",
          sans-serif;
        letter-spacing: -2.2px;
        margin: 12px 0;
      }
      h1 span {
        display: inline-block;
        background: var(--accent);
        padding: 0 9px 3px;
        transform: rotate(-2deg);
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        margin-bottom: 33px;
      }
      .hero p {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }
      .hero-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hero-sticker {
        font-size: 38px;
        line-height: 1;
        transform: rotate(15deg);
        margin-right: 10px;
      }
      .stats {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 14px;
        color: var(--muted);
        margin-top: 18px;
      }
      .stats b {
        color: var(--ink);
        font-family: "Segoe UI";
        font-size: 17px;
      }
      .stats i {
        width: 4px;
        height: 4px;
        background: #999;
        border-radius: 50%;
      }
      .toolbar {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 19px;
      }
      .search {
        display: flex;
        align-items: center;
        border: var(--line);
        background: var(--surface);
        padding: 0 14px;
        border-radius: 5px;
        gap: 10px;
        flex: 1;
        height: 48px;
        max-width: 560px;
      }
      .search input {
        border: 0;
        outline: 0 !important;
        width: 100%;
        background: transparent;
        color: var(--ink);
        min-width: 0;
      }
      .keycap {
        font-size: 12px;
        border: 1px solid #aaa;
        padding: 1px 5px;
        border-radius: 3px;
      }
      .select {
        border: var(--line);
        background: var(--surface);
        border-radius: 5px;
        padding: 11px 35px 11px 12px;
        max-width: 240px;
        color: var(--ink);
      }
      .toolbar .sort {
        margin-left: auto;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 28px;
      }
      .chip {
        border: 1.5px solid var(--ink);
        padding: 7px 13px;
        border-radius: 30px;
        font-size: 14px;
        background: var(--surface);
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .chip.active {
        background: var(--ink);
        color: var(--paper);
      }
      .chip .count {
        font-size: 12px;
        opacity: 0.65;
      }
      .demo-banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: #ebe8f7;
        border: 1px dashed #8e81ad;
        border-radius: 5px;
        padding: 10px 14px;
        margin-bottom: 23px;
        color: #514466;
        font-size: 13px;
      }
      .text-btn {
        border: 0;
        padding: 3px;
        background: none;
        text-decoration: underline;
        font-weight: 600;
        font-size: 14px;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-size: 13px;
        letter-spacing: 1.5px;
        font-weight: 700;
      }
      .section-label:after {
        content: "";
        height: 1px;
        background: #d4d4ca;
        flex: 1;
      }
      .section-label span {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0;
        font-weight: 400;
      }
      .masonry {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: 8px;
        gap: 18px;
        align-items: start;
        grid-auto-flow: dense;
      }
      .card {
        min-width: 0;
      }
      .card.wide {
        grid-column: span 2;
      }
      .card-inner {
        border: var(--line);
        box-shadow: var(--shadow);
        border-radius: 6px;
        background: var(--surface);
        overflow: hidden;
        transition: transform 0.15s;
      }
      .card-inner:hover {
        transform: translateY(-3px);
      }
      .cover {
        position: relative;
        display: block;
        background: #dedbce;
        border-bottom: var(--line);
        overflow: hidden;
        text-decoration: none;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .cover:hover img {
        transform: scale(1.035);
      }
      .cover .type-badge {
        position: absolute;
        top: 11px;
        left: 11px;
        background: #fff;
        border: 1.5px solid #202020;
        border-radius: 3px;
        padding: 4px 7px;
        font-size: 11px;
        font-weight: 700;
        color: #202020;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .cover-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: var(--accent);
        color: #202020;
        font: 700 26px "Segoe UI";
        padding: 20px;
        text-align: center;
        word-break: break-word;
      }
      .graphic .cover {
        background: #c9b9ff;
      }
      .graphic-art {
        height: 100%;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #202020;
        background: #c9b9ff;
        position: relative;
      }
      .graphic-art strong {
        font: 700 clamp(30px, 3vw, 48px) / 0.95 "Segoe UI";
        letter-spacing: -2px;
        z-index: 1;
        max-width: 70%;
      }
      .graphic-art b {
        position: absolute;
        right: 14px;
        bottom: 22px;
        font-size: 115px;
        line-height: 1;
        transform: rotate(-15deg);
        color: #fff5a4;
        -webkit-text-stroke: 2px #202020;
      }
      .graphic-art small {
        font-size: 11px;
        letter-spacing: 2px;
      }
      .code-art {
        height: 100%;
        background: #c4e4d0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #202020;
      }
      .code-art b {
        font: 700 62px "Segoe UI";
        letter-spacing: -5px;
      }
      .code-art span {
        font-size: 13px;
        font-weight: 700;
      }
      .card-body {
        padding: 15px 15px 12px;
      }
      .domain {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .domain img {
        width: 13px;
        height: 13px;
      }
      .card h3 {
        font: 600 18px/1.3 "Segoe UI";
        letter-spacing: -0.4px;
        margin-bottom: 13px;
      }
      .card h3 a {
        text-decoration: none;
      }
      .card h3 a:hover {
        text-decoration: underline;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
      }
      .folder-label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        border: 1px solid #202020;
        color: #202020;
        border-radius: 3px;
        padding: 4px 6px;
        max-width: 75%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .card-controls {
        display: flex;
        gap: 5px;
      }
      .icon-btn {
        border: 1.5px solid var(--ink);
        border-radius: 4px;
        width: 29px;
        height: 29px;
        display: inline-grid;
        place-items: center;
        background: var(--surface);
        padding: 0;
      }
      .icon-btn:hover {
        background: var(--accent);
      }
      svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .icon-btn svg {
        width: 15px;
        height: 15px;
      }
      .dock {
        position: fixed;
        z-index: 5;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        background: var(--surface);
        border: var(--line);
        border-radius: 12px;
        box-shadow: 5px 5px 0 var(--ink);
        padding: 8px;
      }
      .dock button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 19px;
        border: 1.5px solid transparent;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .dock button.active {
        background: var(--accent);
        border-color: var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .dock button:hover {
        background: var(--accent);
      }
      .dock .divider {
        border-left: 1px solid #d6d6cf;
        margin: 8px 3px;
      }
      .folder-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        margin: 25px 0 35px;
      }
      .folder-card {
        position: relative;
        border: var(--line);
        border-radius: 6px;
        box-shadow: var(--shadow);
        background: var(--surface);
        padding: 23px;
        text-align: left;
        min-height: 165px;
      }
      .folder-card:before {
        content: "";
        position: absolute;
        left: 15px;
        top: -10px;
        width: 65px;
        height: 12px;
        background: var(--folder-color);
        border: var(--line);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
      }
      .folder-card .folder-symbol {
        color: #202020;
        display: inline-flex;
        background: var(--folder-color);
        padding: 9px;
        border: var(--line);
        border-radius: 4px;
        margin-bottom: 16px;
      }
      .folder-card h3 {
        font: 600 19px "Segoe UI";
      }
      .folder-card p {
        font-size: 13px;
        color: var(--muted);
        margin-top: 7px;
      }
      .folder-card .edit-folder {
        position: absolute;
        top: 14px;
        right: 12px;
      }
      .folder-open {
        background: none;
        border: 0;
        padding: 0;
        text-align: left;
        width: 100%;
        display: block;
      }
      .breadcrumbs {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 14px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .breadcrumbs button {
        background: none;
        border: 0;
        padding: 0;
        text-decoration: underline;
      }
      .breadcrumbs span {
        color: var(--muted);
      }
      .empty {
        border: 2px dashed #a4a497;
        text-align: center;
        padding: 65px 20px;
        border-radius: 8px;
        margin-top: 20px;
      }
      .empty .empty-icon {
        font-size: 45px;
        margin-bottom: 14px;
      }
      .empty h2 {
        font: 600 25px "Segoe UI";
        margin-bottom: 10px;
      }
      .empty p {
        color: var(--muted);
        margin-bottom: 24px;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        margin-top: 30px;
      }
      .panel {
        background: var(--surface);
        border: var(--line);
        box-shadow: var(--shadow);
        border-radius: 6px;
        padding: 27px;
      }
      .panel h2 {
        font: 600 23px "Segoe UI";
        margin-bottom: 10px;
      }
      .panel p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        margin-top: 20px;
      }
      .field input,
      .field textarea,
      .field select {
        padding: 12px;
        border: var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--ink);
        width: 100%;
      }
      .field textarea {
        resize: vertical;
        min-height: 80px;
      }
      .swatches {
        display: flex;
        gap: 12px;
        margin: 15px 0;
      }
      .swatch {
        width: 39px;
        height: 39px;
        border: var(--line);
        border-radius: 50%;
        position: relative;
        color: #202020;
      }
      .swatch.selected {
        box-shadow: 3px 3px 0 var(--ink);
      }
      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
        margin-top: 10px;
      }
      .danger {
        color: #9e2828;
      }
      .preview-box {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        border: 1px solid #aaa;
        padding: 12px;
        border-radius: 4px;
        align-items: center;
      }
      .preview-box img {
        width: 95px;
        height: 65px;
        object-fit: cover;
        border: 1px solid var(--ink);
      }
      .preview-box span {
        font-size: 13px;
        line-height: 1.4;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 10px;
      }
      .modal-head h2 {
        font: 700 28px "Segoe UI";
        letter-spacing: -1px;
      }
      dialog {
        width: min(550px, calc(100vw - 30px));
        border: var(--line);
        border-radius: 8px;
        box-shadow: 8px 8px 0 var(--ink);
        background: var(--surface);
        color: var(--ink);
        padding: 28px;
        max-height: 90dvh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #1118;
        backdrop-filter: blur(3px);
      }
      .modal-actions {
        display: flex;
        gap: 13px;
        justify-content: flex-end;
        margin-top: 26px;
      }
      .error {
        color: #b12626;
        font-size: 14px;
        margin-top: 13px;
        line-height: 1.5;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        font-size: 14px;
      }
      .checkbox input {
        accent-color: #7156c3;
        width: 18px;
        height: 18px;
      }
      #toast {
        position: fixed;
        bottom: 112px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: var(--ink);
        color: var(--surface);
        padding: 13px 20px;
        border-radius: 5px;
        box-shadow: 3px 3px 0 var(--accent);
        max-width: 90vw;
        display: none;
        font-size: 14px;
      }
      #toast.show {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      #toast button {
        background: none;
        border: 0;
        color: var(--accent);
        text-decoration: underline;
      }
      .import-summary {
        display: flex;
        gap: 30px;
        background: var(--paper);
        padding: 20px;
        margin-top: 20px;
        border: var(--line);
      }
      .import-summary b {
        font: 700 28px "Segoe UI";
        display: block;
      }
      .import-summary span {
        font-size: 13px;
      }
      .list-mode .masonry {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .dark {
        --paper: #22232a;
        --surface: #30313a;
        --ink: #f3f1ea;
        --muted: #bbb9b3;
      }
      .dark .button.primary,
      .dark .dock button.active,
      .dark .icon-btn:hover {
        color: #202020;
      }
      .dark .chip.active {
        color: #202020;
      }
      .dark .demo-banner {
        background: #373041;
        color: #dfd2f4;
      }
      .dark .brand-icon {
        color: #202020;
      }
      .dark .brand-bang {
        color: var(--accent);
      }
      .dark h1 span {
        color: #202020;
      }
      .dark .button:hover {
        box-shadow: 5px 5px 0 var(--ink);
      }
      @media (min-width: 1500px) {
        .masonry {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 1050px) {
        .masonry,
        .list-mode .masonry {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .folder-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .hero-sticker {
          display: none;
        }
        .tagline {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .topbar {
          height: 76px;
          padding: 0 22px;
          gap: 14px;
        }
        .brand {
          font-size: 33px;
        }
        .brand-icon {
          width: 34px;
          height: 34px;
          font-size: 29px;
        }
        .local-badge {
          display: none;
        }
        .import-top {
          margin-left: auto;
        }
        .topbar .button {
          font-size: 12px;
          padding: 8px 10px;
        }
        main {
          padding: 30px 22px 135px;
        }
        .hero {
          align-items: flex-start;
          gap: 18px;
          flex-direction: column;
          margin-bottom: 25px;
        }
        h1 {
          font-size: 36px;
          letter-spacing: -1.8px;
        }
        .hero p {
          font-size: 14px;
        }
        .hero-actions {
          width: 100%;
          justify-content: space-between;
        }
        .hero-actions .button {
          padding: 11px 16px;
        }
        .stats {
          margin-top: 12px;
        }
        .toolbar {
          flex-wrap: wrap;
          gap: 10px;
        }
        .search {
          max-width: none;
          flex-basis: 100%;
        }
        .select {
          font-size: 13px;
          max-width: 50%;
          height: 43px;
        }
        .toolbar .sort {
          margin-left: auto;
        }
        .keycap {
          display: none;
        }
        .masonry,
        .list-mode .masonry {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
          grid-auto-rows: 8px;
        }
        .card.wide {
          grid-column: span 2;
        }
        .graphic-art {
          padding: 16px;
        }
        .graphic-art strong {
          font-size: 32px;
        }
        .graphic-art b {
          font-size: 85px;
          right: 7px;
          bottom: 15px;
        }
        .card-body {
          padding: 12px 10px;
        }
        .card h3 {
          font-size: 16px;
        }
        .card-footer {
          gap: 8px;
          flex-wrap: wrap;
        }
        .folder-label {
          max-width: 100%;
          font-size: 10px;
        }
        .card-controls {
          margin-left: auto;
        }
        .domain {
          font-size: 10px;
          letter-spacing: 0.3px;
        }
        .demo-banner {
          font-size: 12px;
          align-items: flex-start;
        }
        .demo-banner button {
          font-size: 12px;
          flex-shrink: 0;
        }
        .dock {
          bottom: max(16px, env(safe-area-inset-bottom));
          gap: 1px;
          padding: 6px;
          border-radius: 10px;
          width: calc(100% - 36px);
          max-width: 450px;
          justify-content: space-between;
        }
        .dock button {
          flex: 1;
          flex-direction: column;
          padding: 8px 5px;
          gap: 5px;
          font-size: 11px;
        }
        .dock .divider {
          display: none;
        }
        .dock svg {
          width: 21px;
          height: 21px;
        }
        #toast {
          bottom: 105px;
        }
        .folder-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px 15px;
        }
        .folder-card {
          padding: 16px;
          min-height: 150px;
        }
        .folder-card h3 {
          font-size: 17px;
        }
        .settings-grid {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 21px;
        }
        .modal-head h2 {
          font-size: 25px;
        }
        dialog {
          padding: 23px;
        }
        .hero-actions .button.small {
          font-size: 13px;
        }
        .section-label {
          font-size: 11px;
        }
        .eyebrow {
          font-size: 10px;
        }
        .chips {
          gap: 6px;
        }
        .chip {
          font-size: 12px;
          padding: 7px 10px;
        }
      }
      @media (max-width: 370px) {
        .masonry,
        .list-mode .masonry {
          grid-template-columns: 1fr;
        }
        .card.wide {
          grid-column: auto;
        }
        .folder-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
        }
      }

      /* The visible collection determines proportions, including links without a saved layout. */
      .masonry {
        --cover-short: clamp(145px, 12vw, 195px);
        --cover-medium: clamp(195px, 16vw, 250px);
        --cover-tall: clamp(295px, 25vw, 390px);
      }
      .masonry .card {
        --cover-height: var(--cover-medium);
      }
      .masonry .card:nth-child(3n + 1) {
        --cover-height: var(--cover-short);
      }
      .masonry .card:nth-child(3n + 2) {
        --cover-height: var(--cover-tall);
      }
      .masonry .card .cover {
        height: var(--cover-height);
      }
      .list-mode .masonry {
        --cover-short: 120px;
        --cover-medium: 165px;
        --cover-tall: 230px;
      }
      @media (min-width: 371px) {
        .masonry .card:nth-child(6n + 4):not(.graphic):not(.tall):not(.normal) {
          grid-column: span 2;
        }
      }
      @media (max-width: 760px) {
        .masonry {
          --cover-short: 140px;
          --cover-medium: 190px;
          --cover-tall: 260px;
        }
        .list-mode .masonry {
          --cover-short: 110px;
          --cover-medium: 150px;
          --cover-tall: 205px;
        }
      }

      .brand-icon {
        transform: none;
        border: 0;
        box-shadow: none;
        background: none;
      }
      .brand-icon img {
        width: 100%;
        height: 100%;
      }
      .install-steps {
        padding-left: 1.5rem;
        line-height: 1.7;
      }
      .install-steps li + li {
        margin-top: 0.65rem;
      }
      .local-notice {
        padding: 12px;
        background: #ffe7a8;
        color: #202020;
      }
      .topbar .import-top {
        margin-left: auto;
      }
      @media (max-width: 600px) {
        .topbar {
          gap: 8px;
          padding: 0 12px;
        }
        .brand {
          font-size: 25px;
        }
        .brand-icon {
          width: 27px;
        }
        .topbar .button {
          padding: 6px;
          font-size: 12px;
        }
      }
    </style>
  </head>

            box.innerHTML = `<div class="preview-box">${data.image ? `<img src="${e(data.image)}" alt="Prévia do link" referrerpolicy="no-referrer">` : icon("link")}<span>${e(data.title)}<br><small>${e(new URL(url).hostname)}</small></span></div>`;

          document.querySelector("#inline-folder").onclick = () => {
            const field = document.createElement("div");
            field.className = "field";
            field.innerHTML =
              '<label>Nome da nova pasta<input id="inline-folder-name" maxlength="100" placeholder="Nome da pasta"></label><button type="button" class="button small">Criar pasta</button>';
            document.querySelector("#inline-folder").replaceWith(field);
            field.querySelector("button").onclick = () => {
              const name = field.querySelector("input").value.trim();
              if (!name) return;
              const f = {
                id: uid(),
                name,
                parentId: form.elements.folder.value || null,
                color: state.prefs.accent,
              };
              state.folders.push(f);
              save();
              form.elements.folder.innerHTML = options(f.id);
              field.remove();
            };
          };
          if (b)
            document.querySelector("#delete-link").onclick = () => {
              closeModal();
              confirmModal(
                "Excluir marcador?",
                `“${e(b.title)}” será removido da coleção.`,
                () => {
                  state.bookmarks = state.bookmarks.filter(
                    (x) => x.id !== b.id,
                  );
                  save();
                  render();
                  toast("Marcador excluído.", () => {
                    state.bookmarks.push(b);
                    save();
                    render();
                  });
                },
              );
            };
          form.onsubmit = (event) => {
            event.preventDefault();
            try {
              const url = normalizeURL(urlInput.value);
              if (state.bookmarks.some((x) => x.id !== b?.id && x.url === url))
                throw Error(
                  "Este link já está salvo. Busque pelo domínio para encontrá-lo.",
                );
              const data = fetched?.url === url ? fetched : null;
              const same = b?.url === url;
              const entry = {
                ...b,
                id: b?.id || uid(),
                url,
                title:
                  form.elements.title.value.trim() ||
                  data?.title ||
                  new URL(url).hostname,
                note: form.elements.note.value.trim(),
                folderId: form.elements.folder.value || null,
                type: data?.type || detectType(url),
                image: data?.image || (same ? b.image : initialImage(url)),
                createdAt: b?.createdAt || Date.now(),
                done: b?.done || false,
                completedAt: b?.completedAt || null,
              };
              if (b)
                state.bookmarks = state.bookmarks.map((x) =>
                  x.id === b.id ? entry : x,
                );
              else state.bookmarks.unshift(entry);
              save();
              closeModal();
              render();
              toast(b ? "Marcador atualizado." : "Mais uma descoberta salva!");
              if (!data && state.prefs.remote) refreshEntries([entry]);
            } catch (error) {
              document.querySelector("#form-error").textContent = error.message;
            }
          };
        }
        function confirmModal(title, message, action) {
          openModal(
            title,
            `<p class="hint">${message}</p><div class="modal-actions"><button class="button" data-close>Cancelar</button><button class="button primary" id="confirm-action">Confirmar</button></div>`,
          );
          document.querySelector("#confirm-action").onclick = () => {
            closeModal();
            action();
          };
        }
        function folderModal(id) {
          const f = state.folders.find((f) => f.id === id);
          const excluded = f ? descendants(state.folders, f.id) : new Set();
          openModal(
            f ? "Editar pasta" : "Um lugar para suas ideias",
            `<form id="folder-form"><label class="field">Nome da pasta<input name="name" required maxlength="100" placeholder="Ex.: Ideias para o próximo projeto" value="${e(f?.name || "")}"></label><label class="field">Dentro de<select name="parent">${options(f ? f.parentId : folder, excluded).replace("Sem pasta", "Nível principal")}</select></label><label class="field">Cor<input type="color" name="color" value="${f?.color || state.prefs.accent}"></label><div class="modal-actions">${f ? '<button type="button" class="text-btn danger" id="delete-folder">Excluir pasta</button>' : ""}<button class="button" type="button" data-close>Cancelar</button><button class="button primary" type="submit">${f ? "Salvar alterações" : "Criar pasta"}</button></div></form>`,
          );
          const form = document.querySelector("#folder-form");
          form.onsubmit = (ev) => {
            ev.preventDefault();
            const name = form.elements.name.value.trim();
            if (!name) {
              form.elements.name.setCustomValidity("Dê um nome à pasta.");
              form.elements.name.reportValidity();
              form.elements.name.oninput = () =>
                form.elements.name.setCustomValidity("");
              return;
            }
            const item = {
              id: f?.id || uid(),
              name,
              parentId: form.elements.parent.value || null,
              color: form.elements.color.value,
            };
            if (f)
              state.folders = state.folders.map((x) =>
                x.id === f.id ? item : x,
              );
            else state.folders.push(item);
            save();
            closeModal();
            render();
            toast(f ? "Pasta atualizada." : "Pasta criada.");
          };
          if (f)
            document.querySelector("#delete-folder").onclick = () => {
              closeModal();
              confirmModal(
                "Excluir pasta e subpastas?",
                `As ${excluded.size} pastas serão removidas. Os marcadores serão preservados em “Sem pasta”.`,
                () => {
                  state.folders = state.folders.filter(
                    (x) => !excluded.has(x.id),
                  );
                  state.bookmarks.forEach((b) => {
                    if (excluded.has(b.folderId)) b.folderId = null;
                  });
                  if (excluded.has(folder)) folder = null;
                  save();
                  render();
                  toast("Pastas excluídas. Os links foram preservados.");
                },
              );
            };
        }
        async function refreshEntries(entries) {
          let count = 0;
          const queue = [...entries];
          async function worker() {
            while (queue.length && state.prefs.remote) {
              const b = queue.shift();
              const url = b.url;
              const result = await metadata(url);
              const existing = state.bookmarks.find(
                (x) => x.id === b.id && x.url === url,
              );
              if (existing) {
                existing.image = result.image || existing.image;
                existing.type = result.type;
                if (existing.title === new URL(url).hostname || !existing.title)
                  existing.title = result.title;
              }
              count++;
              save();
              if (!modal.open && view !== "settings") renderCards();
            }
          }
          await Promise.all([worker(), worker()]);
          if (entries.length > 1)
            toast(
              `${count} prévias consultadas. Imagens indisponíveis usam uma captura ou o domínio.`,
            );
        }
        async function importFile(file) {
          try {
            if (file.size > 20 * 1024 * 1024)
              throw Error("O arquivo deve ter até 20 MB.");
            const text = await file.text();
            pendingImport =
              /\.json$/i.test(file.name) || text.trim().startsWith("{")
                ? validateBackup(JSON.parse(text))
                : parseHTML(text);
            const duplicates = pendingImport.bookmarks.filter((b) =>
              state.bookmarks.some((x) => x.url === b.url),
            ).length;
            openModal(
              "Suas descobertas estão chegando",
              `<p class="hint">Revise a importação de ${e(file.name)}. Seus marcadores atuais serão preservados.</p><div class="import-summary"><div><b>${pendingImport.bookmarks.length}</b><span>links válidos</span></div><div><b>${pendingImport.folders.length}</b><span>pastas</span></div></div><p class="hint">${duplicates} links já estão na coleção. ${pendingImport.invalid} links inválidos serão ignorados.</p><label class="checkbox"><input type="checkbox" id="skip-duplicates" checked>Ignorar links duplicados</label><div class="modal-actions"><button class="button" data-close>Cancelar</button><button class="button primary" id="confirm-import">Importar favoritos</button></div>`,
            );
            document.querySelector("#confirm-import").onclick = () => {
              const previousIds = new Set(state.bookmarks.map((b) => b.id));
              const merged = mergeBackup(
                state,
                pendingImport,
                document.querySelector("#skip-duplicates").checked,
              );
              state.folders = merged.folders;
              state.bookmarks = merged.bookmarks;
              save();
              closeModal();
              render();
              const added = state.bookmarks.filter(
                (b) => !previousIds.has(b.id),
              );
              toast(
                `${added.length} links importados. ${merged.skipped} duplicados ignorados.`,
              );
              if (state.prefs.remote)
                refreshEntries(added.filter((b) => !b.image));
              pendingImport = null;
            };
          } catch (error) {
            toast(
              error instanceof SyntaxError
                ? "JSON inválido. Verifique o arquivo e tente novamente."
                : error.message,
            );
          }
        }
        document.addEventListener("click", (ev) => {
          const target = ev.target.closest("button");
          if (!target) return;
          if (target.dataset.nav) go(target.dataset.nav);
          else if (target.hasAttribute("data-close")) closeModal();
          else if (target.hasAttribute("data-add")) linkModal();
          else if (target.dataset.edit) linkModal(target.dataset.edit);
          else if (target.dataset.complete) {
            const b = state.bookmarks.find(
              (b) => b.id === target.dataset.complete,
            );
            const old = { done: b.done, completedAt: b.completedAt };
            b.done = !b.done;
            b.completedAt = b.done ? Date.now() : null;
            save();
            render();
            toast(
              b.done
                ? "Marcador concluído. Boa descoberta!"
                : "Marcador voltou aos pendentes.",
              () => {
                Object.assign(b, old);
                save();
                render();
              },
            );
          } else if (target.hasAttribute("data-new-folder")) folderModal();
          else if (target.dataset.editFolder)
            folderModal(target.dataset.editFolder);
          else if (target.hasAttribute("data-folder")) {
            folder = target.dataset.folder || null;
            render();
          } else if (target.dataset.type) {
            type = target.dataset.type;
            document.querySelectorAll("[data-type]").forEach((el) => {
              el.classList.toggle("active", el.dataset.type === type);
              el.setAttribute("aria-pressed", el.dataset.type === type);
            });
            renderCards();
          } else if (target.dataset.status) {
            status = target.dataset.status;
            render();
          } else if (
            target.hasAttribute("data-import") ||
            target.id === "import-top"
          )
            document.querySelector("#import-file").click();
          else if (target.dataset.export) {
            try {
              const json = target.dataset.export === "json";
              download(
                `save-it-backup-${new Date().toISOString().slice(0, 10)}.${json ? "json" : "html"}`,
                json
                  ? JSON.stringify({ ...state, version: 1 }, null, 2)
                  : exportHTML(state),
                json ? "application/json" : "text/html",
              );
              toast("Backup exportado.");
            } catch (error) {
              toast(error.message);
            }
          } else if (target.dataset.accent) {
            state.prefs.accent = target.dataset.accent;
            save();
            render();
          } else if (target.id === "clear-demo")
            confirmModal(
              "Começar sua própria coleção?",
              "Os links de exemplo serão removidos. Seus links pessoais serão preservados.",
              () => {
                state.bookmarks = state.bookmarks.filter((b) => !b.demo);
                const used = new Set();
                state.bookmarks.forEach((b) =>
                  folderPath(state.folders, b.folderId).forEach((f) =>
                    used.add(f.id),
                  ),
                );
                state.folders = state.folders.filter(
                  (f) =>
                    !["design", "web", "places", "learn", "games"].includes(
                      f.id,
                    ) || used.has(f.id),
                );
                save();
                render();
                toast("Tudo pronto para suas descobertas.");
              },
            );
          else if (target.id === "refresh-previews") {
            target.disabled = true;
            target.textContent = "Consultando prévias...";
            refreshEntries(state.bookmarks).finally(() => {
              if (target.isConnected) {
                target.disabled = false;
                target.textContent = "Atualizar prévias";
              }
            });
          }
        });
        document.addEventListener("input", (ev) => {
          if (ev.target.id === "search") {
            query = ev.target.value;
            renderCards();
          }
        });
        document.addEventListener("change", (ev) => {
          const el = ev.target;
          if (el.id === "folder-filter") {
            folder = el.value === "all" ? null : el.value;
            if (view === "folders") render();
            else renderCards();
          } else if (el.id === "sort") {
            sort = el.value;
            renderCards();
          } else if (["theme", "density", "remote"].includes(el.id)) {
            state.prefs[el.id] = el.id === "remote" ? el.checked : el.value;
            save();
            render();
          } else if (el.id === "import-file" && el.files[0]) {
            importFile(el.files[0]);
            el.value = "";
          }
        });
        document.addEventListener("keydown", (ev) => {
          if (
            ev.key === "/" &&
            !["INPUT", "TEXTAREA", "SELECT"].includes(
              document.activeElement.tagName,
            ) &&
            !modal.open
          ) {
            ev.preventDefault();
            document.querySelector("#search")?.focus();
          }
        });
        modal.addEventListener("click", (ev) => {
          if (ev.target === modal) {
            const r = modal.getBoundingClientRect();
            if (
              ev.clientX < r.left ||
              ev.clientX > r.right ||
              ev.clientY < r.top ||
              ev.clientY > r.bottom
            )
              closeModal();
          }
        });
        modal.addEventListener("cancel", () => previewToken++);
        window.addEventListener("resize", layoutCards);
        window.addEventListener("storage", (ev) => {
          if (ev.key === KEY && ev.newValue) {
            try {
              const next = JSON.parse(ev.newValue);
              if (
                Array.isArray(next.bookmarks) &&
                Array.isArray(next.folders)
              ) {
                state = next;
                render();
              }
            } catch {}
          }
        });
        document.querySelector(".brand").onclick = (ev) => {
          ev.preventDefault();
          go("home");
        };
        render();
        if (loadError) toast(loadError);

        // ZIP "store" is sufficient for the two small Windows shortcut files.
        function shortcutArchive(files) {
          const encoder = new TextEncoder();
          const entries = [],
            directory = [];
          let offset = 0,
            directorySize = 0;
          function header(length, signature) {
            const view = new DataView(new ArrayBuffer(length));
            view.setUint32(0, signature, true);
            return view;
          }
          function crc32(bytes) {
            let crc = -1;
            for (const byte of bytes) {
              crc ^= byte;
              for (let i = 0; i < 8; i++)
                crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
            }
            return ~crc >>> 0;
          }
          for (const [name, data] of files) {
            const filename = encoder.encode(name);
            const sum = crc32(data);
            const local = header(30, 0x04034b50);
            local.setUint16(4, 20, true);
            local.setUint16(12, 33, true);
            local.setUint32(14, sum, true);
            local.setUint32(18, data.length, true);
            local.setUint32(22, data.length, true);
            local.setUint16(26, filename.length, true);
            entries.push(local.buffer, filename, data);
            const central = header(46, 0x02014b50);
            central.setUint16(4, 20, true);
            central.setUint16(6, 20, true);
            central.setUint16(14, 33, true);
            central.setUint32(16, sum, true);
            central.setUint32(20, data.length, true);
            central.setUint32(24, data.length, true);
            central.setUint16(28, filename.length, true);
            central.setUint32(42, offset, true);
            directory.push(central.buffer, filename);
            offset += 30 + filename.length + data.length;
            directorySize += 46 + filename.length;
          }
          const end = header(22, 0x06054b50);
          end.setUint16(8, files.length, true);
          end.setUint16(10, files.length, true);
          end.setUint32(12, directorySize, true);
          end.setUint32(16, offset, true);
          return new Blob([...entries, ...directory, end.buffer], {
            type: "application/zip",
          });
        }

        function makeWindowsShortcut(address) {
          const file = new URL(address);
          if (file.protocol !== "file:")
            throw Error("Abra o arquivo HTML salvo no computador.");
          file.search = "";
          file.hash = "";
          const icon = new URL("Save-It.ico", file);
          const path = decodeURIComponent(icon.pathname);
          const windowsPath = (
            icon.hostname
              ? "//" + icon.hostname + path
              : path.replace(/^\/(?=[a-z]:)/i, "")
          ).replaceAll("/", "\\");
          if (/[\r\n]/.test(windowsPath))
            throw Error("Escolha uma pasta sem quebras de linha no nome.");
          const shortcut =
            "\uFEFF[InternetShortcut]\r\nURL=" +
            file.href +
            "\r\nIconFile=" +
            windowsPath +
            "\r\nIconIndex=0\r\n";
          const bytes = new Uint8Array(shortcut.length * 2);
          const view = new DataView(bytes.buffer);
          for (let i = 0; i < shortcut.length; i++)
            view.setUint16(i * 2, shortcut.charCodeAt(i), true);
          const iconBytes = Uint8Array.from(atob(DESKTOP_ICO), (char) =>
            char.charCodeAt(0),
          );
          return shortcutArchive([
            ["Save It!.url", bytes],
            ["Save-It.ico", iconBytes],
          ]);
        }

        document
          .getElementById("create-shortcut")
          .addEventListener("click", () => {
            openModal(
              "Atalho para Windows",
              '<ol class="install-steps"><li>Guarde <strong>Save-It.html</strong> em uma pasta permanente e abra-o de lá.</li><li>Baixe o atalho e extraia o ZIP na mesma pasta do HTML. Deixe <strong>Save-It.ico</strong> nessa pasta.</li><li>Mova <strong>Save It!.url</strong> para a Área de Trabalho. Um duplo clique nele abre sua coleção local.</li></ol><div class="modal-actions"><button class="button primary" id="shortcut-zip">Baixar atalho com ícone</button></div>',
            );
            document.getElementById("shortcut-zip").onclick = () => {
              try {
                download(
                  "Save-It-atalho.zip",
                  makeWindowsShortcut(location.href),
                  "application/zip",
                );
              } catch (error) {
                closeModal();
                toast(error.message);
              }
            };
          });
      })();
    </script>
  </body>
